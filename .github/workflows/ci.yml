name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # 外链会随时间腐烂（Release 被删、仓库改名），即使仓库没动也定期体检
    - cron: '0 4 * * 1'

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 scripts/build_site.py
      - name: Assert output
        run: |
          test -f site/index.html
          test -f site/search.json
          test -f site/CNAME
          pages=$(find site -name '*.html' | wc -l)
          test "$pages" -ge 12
          echo "页面数 $pages"

  check:
    name: 结构与站内链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_site.py
      # PR 上跳过外链（GitHub 侧有速率限制，反馈要快）；定时任务才全量查
      - name: Check structure
        if: github.event_name != 'schedule'
        run: python3 scripts/check_site.py --skip-links
      - name: Check structure + links (scheduled)
        if: github.event_name == 'schedule'
        run: python3 scripts/check_site.py

  pages-config:
    name: 校验 Pages 用的 CNAME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_site.py
      # 域名写错会导致 GitHub Pages 掉回 *.github.io，且没有任何报错。
      #
      # 现在 data/ 里有两个地址，它们不是重复：
      #   domain   = 目标域名（只用来产出 CNAME）
      #   base_url = 站点现在实际在哪儿（canonical / sitemap / robots 都用它）
      # 所以这里断言的是「每个地址各自只有一处真相源」，而不是
      # 「域名在整个文件里只出现一次」——后者会把 base_url 误判成重复。
      - name: Addresses have a single source of truth
        run: |
          python3 - <<'PY'
          import re, sys
          text = open('data/projects.py', encoding='utf-8').read()
          # 只统计赋值语句里的字符串字面量，注释里的提及不算
          domains = re.findall(r'^\s*"domain":\s*"([^"]+)"', text, re.M)
          bases = re.findall(r'^\s*"base_url":\s*"([^"]+)"', text, re.M)
          assert len(domains) == 1, f'domain 出现 {len(domains)} 次，应恰好 1 次'
          assert len(bases) == 1, f'base_url 出现 {len(bases)} 次，应恰好 1 次'
          cname = open('site/CNAME', encoding='utf-8').read().strip()
          assert cname == domains[0], f'CNAME {cname} != domain {domains[0]}'
          # base_url 必须是能打开的地址：canonical 不该指向一个解析不到的域名
          assert bases[0].startswith('https://'), 'base_url 必须是 https'
          print(f'domain={domains[0]}  base_url={bases[0]}  CNAME OK')
          PY
