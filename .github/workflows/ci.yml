name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # 外链会随时间腐烂（Release 被删、仓库改名），即使仓库没动也定期体检
    - cron: '0 4 * * 1'

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 scripts/build_site.py
      - name: Assert output
        run: |
          test -f site/index.html
          test -f site/store.html
          test -f site/search.json
          test -f site/CNAME
          pages=$(find site -name '*.html' | wc -l)
          test "$pages" -ge 13
          echo "页面数 $pages"
          # 商店页必须真的有可下载的应用，不能是空壳
          n=$(grep -o 'data-apk="' site/store.html | wc -l)
          test "$n" -ge 8
          echo "商店页可下载 $n 个"

  check:
    name: 结构与站内链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_site.py
      # PR 上跳过外链（GitHub 侧有速率限制，反馈要快）；定时任务才全量查
      - name: Check structure
        if: github.event_name != 'schedule'
        run: python3 scripts/check_site.py --skip-links
      - name: Check structure + links (scheduled)
        if: github.event_name == 'schedule'
        run: python3 scripts/check_site.py

  releases:
    name: 校验 Release 元数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 scripts/build_site.py
      # 商店页的版本号/体积来自 data/releases.json。它是个快照，
      # 仓库发了新版但没人重新生成，商店就会一直显示旧版本——而且没人会发现。
      # 这里联网对比一次，把「快照过期」变成 CI 红。
      - name: releases.json 是否与线上 Release 一致
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_releases.py --check

  pages-config:
    name: 校验 Pages 用的 CNAME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_site.py
      # 域名写错会导致 GitHub Pages 掉回 *.github.io，且没有任何报错。
      # 这里把「域名只有一处真相源」钉住。
      - name: Domain appears exactly once as source of truth
        run: |
          n=$(grep -c 'icesuite.eu.org' data/projects.py)
          test "$n" -eq 1
          grep -q 'icesuite.eu.org' site/CNAME
