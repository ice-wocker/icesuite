name: Deploy site

# 把 data/（自动同步的 registry + 手写叠加层）渲染成静态站点并发布到 GitHub Pages。
#
# 内容源有两层：
#   data/registry.json  ← scripts/sync.py 从 GitHub 自动同步（项目清单、版本、包元数据）
#   data/projects.py    ← 人写的介绍 / 亮点 / 已知限制（可选叠加，不决定有哪些项目）
#
# 所以「发一个新版本」不需要人动这个仓库：sync 工作流更新快照 →
# 这里的 paths 命中 data/** → 自动重新发布。
on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  # sync 用默认 token 推提交时不会触发 push 事件（GitHub 防递归），由它显式 dispatch
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages          # 同时只跑一个发布，避免两个 commit 抢 Pages 锁
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build static site
        run: python3 scripts/build_site.py
