name: Deploy site

# 把 data/projects.py 渲染成静态站点并发布到 GitHub Pages。
# 站点是清单的投影，唯一真相源是 data/projects.py。
on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages          # 同时只跑一个发布，避免两个 commit 抢 Pages 锁
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build static site
        run: python3 scripts/build_site.py
      - name: Assert output
        run: |
          test -f site/index.html
          test -f site/store.html
          test -f site/search.json
          test -f site/CNAME
          grep -q 'icesuite.eu.org' site/CNAME
          pages=$(find site -name '*.html' | wc -l)
          echo "生成 HTML 页面数: $pages"
          test "$pages" -ge 13
          n=$(grep -o 'data-apk="' site/store.html | wc -l)
          echo "商店页可下载: $n"
          test "$n" -ge 8
      # 发布前再跑一次自检：宁可不上线，也不让坏产物出去
      - name: Self check
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
